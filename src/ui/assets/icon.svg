  </g>
  <circle cx="18.5" cy="16.5" r="3" fill="#E95420" />
  <circle cx="18.5" cy="32" r="3" fill="#E95420" />
  <circle cx="18.5" cy="47.5" r="3" fill="#77216F" />
  <g fill="#77216F" fill-opacity=".3">
    <rect x="26" y="14.75" width="19" height="3.5" rx="1.75" />
    <rect x="26" y="30.25" width="19" height="3.5" rx="1.75" />
    <rect x="26" y="45.75" width="19" height="3.5" rx="1.75" />
  </g>
</svg>
