name: Ubuntu Panel

on:
  workflow_dispatch:

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh

      # The panel is TypeScript: build it (dist/), then drop the dev toolchain.
      - name: Install dependencies
        run: npm ci

      - name: Build panel
        run: npm run build

      - name: Remove dev dependencies
        run: npm prune --omit=dev

      # OpenSSH server and 9router are not installed here: the panel installs
      # them on demand (install button on their cards), then starts them.
      - name: Run panel (starts Tailscale + proxy automatically; SSH and 9router are installed and started from the panel)
        env:
          PANEL_USERNAME: ${{ secrets.PANEL_USERNAME }}
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          # Optional repository variable; empty means the default (github-ubuntu)
          TAILSCALE_HOSTNAME: ${{ vars.TAILSCALE_HOSTNAME }}
          PROXY_CREDENTIALS: ${{ secrets.PROXY_CREDENTIALS }}
        run: npm start
