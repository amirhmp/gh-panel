name: Ubuntu Panel

on:
  workflow_dispatch:

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh

      - name: Install OpenSSH server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          # The panel runs its own sshd, bound to the Tailscale IP only
          sudo systemctl disable --now ssh.socket || true
          sudo systemctl disable --now ssh.service || true

      - name: Install dependencies
        run: npm install --omit=dev

      # Installed but not started: the panel enables it on demand (off by default).
      # --ignore-scripts skips its postinstall (it only pre-fetches optional SQLite
      # engines; the panel runs it on Node's built-in node:sqlite instead).
      - name: Install 9router
        run: npm install -g 9router@latest --ignore-scripts

      - name: Run panel (starts Tailscale + SSH + proxy automatically; 9router stays off until enabled)
        env:
          PANEL_USERNAME: ${{ secrets.PANEL_USERNAME }}
          PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          PROXY_CREDENTIALS: ${{ secrets.PROXY_CREDENTIALS }}
        run: npm start
