[package]
name = "gh-panel-client"
version = "0.1.0"
description = "Desktop client for GH Panel"
edition = "2021"

[lib]
name = "gh_panel_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain HTTP only (the panel is reached over the tailnet, already encrypted by WireGuard).
reqwest = { version = "0.12", default-features = false, features = ["json"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
